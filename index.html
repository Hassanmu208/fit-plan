            gap: 6px
        }

            min-height: 40px;
            padding: 5px;
            border-color: var(--border);
            border-radius: 12px;

            color: #14220b;
            background: var(--accent);
            border-color: var(--accent)

        .home-water-actions .home-water-undo {
            flex: 0 0 40px
        }

        .home-weight-line {
            margin: 0 0 11px;
            gap: 8px
        }

        .home-weight-line div {
            padding: 9px 7px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .11)
        }

        .home-weight-line .muted {
            font-size: .67rem
        }

        .home-weight-line b {
            font-size: .88rem
        }

        .home-shortcuts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-bottom: 10px
        }

        .home-dashboard .home-shortcut {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            min-height: 94px;
            padding: 12px 11px;
            margin: 0;
            border: 1px solid var(--border);
            border-inline-start: 1px solid var(--border);
            border-radius: 17px;
            text-align: start;
            background: var(--card);
            box-shadow: 0 8px 22px rgba(0, 0, 0, .13)
        }

        .home-shortcut-icon {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: none;
            color: var(--accent);
            border-radius: 11px;
            background: color-mix(in srgb, var(--accent) 16%, var(--card2))
        }

        .home-shortcut-icon .ico {
            width: 20px;
            height: 20px
        }

        .home-shortcut-copy {
            display: grid;
            gap: 5px;
            min-width: 0
        }

        .home-shortcut-copy b {
            font-size: .77rem
        }

        .home-shortcut-copy span {
            overflow: hidden;
            color: var(--muted);
            font-size: .69rem;
            line-height: 1.45;
            text-overflow: ellipsis
        }

        .home-shortcut-arrow,
        .home-sub-arrow {
            margin-inline-start: auto;
            color: var(--muted);
            font-size: 1.15rem
        }

        .home-dashboard .home-subscription {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 68px;
            padding: 11px 14px;
            margin: 0;
            border: 1px solid var(--border);
            border-inline-start: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card);
            box-shadow: 0 7px 20px rgba(0, 0, 0, .12)
        }

        .home-sub-icon {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: none;
            color: var(--accent);
            border-radius: 11px;
            background: color-mix(in srgb, var(--accent) 15%, var(--card2))
        }

        .home-sub-icon .ico {
            width: 19px;
            height: 19px
        }

        .home-sub-copy {
            display: grid;
            gap: 3px
        }

        .home-sub-copy b {
            font-size: .77rem
        }

        .home-sub-copy span {
            color: var(--muted);
            font-size: .72rem
        }

        .home-sub-arrow {
            margin-inline-start: auto;
            color: var(--muted);
            font-size: 1.15rem
        }

        @keyframes home-water-slosh {
            0% {
                translate: 0 0;
                rotate: 0deg
            }

            16% {
                translate: 4px 1px;
                rotate: 1.1deg
            }

            36% {
                translate: -3.5px -1px;
                rotate: -.9deg
            }

            56% {
                translate: 2.5px 1px;
                rotate: .65deg
            }

            76% {
                translate: -1px 0;
                rotate: -.3deg
            }

            100% {
                translate: 0 0;
                rotate: 0deg
            }
        }

        @keyframes home-water-bubble {
            0% {
                transform: translateY(9px);
                opacity: 0
            }

            20% {
                opacity: 1
            }

            100% {
                transform: translateY(-13px);
                opacity: 0
            }
        }

        @media(max-width:420px) {
            .home-dashboard .dash2 {
                gap: 6px
            }

            .home-dashboard .dash2 .tile {
                padding: 9px 7px;
                min-height: 86px
            }

            .home-dashboard .dash2 .tile .hrow span {
                font-size: .63rem
            }

            .home-dashboard .dash2 .tile .hrow .ico {
                width: 15px;
                height: 15px
            }

            .home-dashboard .dash2 .tile b {
                font-size: 1.03rem
            }

            .home-water-body {
                grid-template-columns: 64px minmax(0, 1fr);
                gap: 8px
            }

            .home-cup {
                width: 59px;
                height: 83px
            }

            .home-water-actions {
                gap: 4px
            }

            .home-water-actions .wbtn {
                min-height: 38px;
                font-size: .7rem
            }

            .home-water-actions .home-water-undo {
                flex-basis: 36px
            }

            .home-dashboard .home-shortcut {
                padding: 10px 8px;
                gap: 6px
            }

            .home-shortcut-icon {
                width: 29px;
                height: 29px
            }

            .home-shortcut-copy b {
                font-size: .7rem
            }

            .home-shortcut-copy span {
                font-size: .63rem
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .home-cup-wrap.splash .home-wave-flow,
            .home-cup-wrap.splash .home-bubbles {
                animation: none !important
            }
        }

        button.ib {
            width: 18px;
            height: 18px;
            min-width: 18px;
            min-height: 18px;
            border: 0;
            background: transparent;
            color: var(--muted);
        }

        button.ib:hover {
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, transparent);
        }

        button.ib .info-mark {
            display: block;
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        body:has(#app[data-flow="app"][data-section="workout"]),
        body:has(#app[data-flow="app"][data-section="progress"]) {

        }

        body:has(#app[data-flow="app"][data-section="progress"])::before {

        body:has(#app[data-flow="app"][data-section="workout"])>main,
        body:has(#app[data-flow="app"][data-section="progress"])>main,

        body:has(#app[data-flow="app"][data-section="nutri"])>header,

        body:has(#app[data-flow="app"][data-section="progress"])>main {

        }

        body:has(#app[data-flow="app"][data-section="workout"])>nav,
        body:has(#app[data-flow="app"][data-section="progress"])>nav {

        body:has(#app[data-flow="app"] .home-dashboard)::before,
        body:has(#app[data-flow="app"][data-section="nutri"])::before,
        body:has(#app[data-flow="app"][data-section="workout"])::before,
        body:has(#app[data-flow="app"][data-section="progress"])::before {

        body:has(#app[data-flow="app"][data-section="set"]) {

            backdrop-filter: blur(14px);
        }

        body:has(#app[data-flow="app"][data-section="set"])>main {
            background: transparent;
        }

        body:has(#app[data-flow="app"][data-section="set"])>nav {
            backdrop-filter: blur(14px);
        }
