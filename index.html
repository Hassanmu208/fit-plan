    @media(prefers-color-scheme:light) {

        --bg: #f4f5f8;

        --text: #15151f;

        --border: #d8dae4
      }
    }

    :root[data-theme=light] {
      --bg: #f4f5f8;
      --card: #fff;
      --card2: #eceef4;
      --accent: #5b6b00;
      --accent2: #007a55;
      --accent3: #c2410c;
      --text: #15151f;
      --muted: #5b5b70;
      --border: #d8dae4
    }

    [lang=en] {
      --font: 'Inter', system-ui, sans-serif
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      min-height: 44px
    }

    :focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 2px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border)
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 900
    }

    .pill {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0 14px;
      min-width: 44px
    }

    main {
      padding: 16px;
      max-width: 640px;
      margin: auto
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      border-inline-start: 4px solid var(--accent2)
    }

    .card h3 {
      font-size: .9rem;
      margin-bottom: 6px
    }

    .muted {
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.6
    }

    .warn {
      background: rgba(255, 107, 71, .1);
      border: 1px solid var(--accent3);
      color: var(--accent3);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: .8rem;
      line-height: 1.6
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 14px
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 12px;
      padding: 0 14px
    }

    .chip[aria-pressed=true] {
      background: var(--accent);
      color: #0d0d12;
      border-color: var(--accent);
      font-weight: 700
    }

    .btn {
      background: var(--accent);
      color: #0d0d12;
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: 700
    }

    .btn.sec {
      background: var(--card2);
      color: var(--text)
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px
    }

    label.f {
      display: block;
      font-size: .8rem;
      color: var(--muted);
      margin-top: 12px
    }

    input[type=text],
    input[type=number],
    input[inputmode] {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-top: 4px
    }

    .bar {
      height: 6px;
      background: var(--card2);
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--accent2)
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px
    }

    .stats div {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center
    }

    .stats b {
      display: block;
      font-size: 1.05rem;
      color: var(--accent)
    }

    .stats span {
      font-size: .65rem;
      color: var(--muted)
    }

    details.ex {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px
    }

    details.ex summary {
      padding: 12px 14px;
      min-height: 44px;
      cursor: pointer;
      font-weight: 700;
      font-size: .88rem;
      list-style: none;
      display: flex;
      justify-content: space-between
    }

    details.ex summary::after {
      content: '▾'
    }

    details[open].ex summary::after {
      transform: rotate(180deg)
    }

    .exb {
      padding: 0 14px 14px
    }

    .sets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .set {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card2)
    }

    .set[aria-pressed=true] {
      background: var(--accent2);
      color: #0d0d12;
      border-color: var(--accent2);
      font-weight: 700
    }

    a {
      color: var(--accent2)
    }

    nav {
      position: fixed;
      bottom: 0;
      inset-inline: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom)
    }

    nav button {
      flex: 1;
      background: none;
      border: 0;
      font-size: .72rem;
      color: var(--muted);
      padding: 8px 0
    }

    nav button[aria-current=page] {
      color: var(--accent);
      font-weight: 700
    }

    .days {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 12px;
      scrollbar-width: none
    }

    .days .chip {
      flex-shrink: 0
    }

    .meal {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .meal input {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: var(--accent2)
    }

    .swap {
      margin-inline-start: auto;
      background: var(--card2);
      border: 0;
      border-radius: 10px;
      padding: 0 12px
    }

    .w-row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    svg {
      width: 100%;
      height: auto;
      display: block
    }

    bdi {
      unicode-bidi: isolate
    }

      }
    }

    :root {
      --bg: #0a0a14;

      z-index: 5
    }

      border-inline-start-color: var(--c, var(--accent2))
    }

      background: var(--c, var(--accent));

    }

    }

    .btn.sec {
      background: var(--card2)
    }

    details.ex {
      border-inline-start: 4px solid var(--c, var(--accent2))
    }

    .hero {
      display: flex;
      gap: 14px;

      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(155, 123, 255, .3), rgba(46, 230, 166, .18));

      margin-bottom: 14px

      font-size: 1.25rem

    .ring {
      --p: 0;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      flex-shrink: 0;
      background: conic-gradient(var(--accent2) calc(var(--p)*1%), var(--card2) 0);
      display: grid;
      place-items: center
    }

    .ring b {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--card);
      display: grid;
      place-items: center;
      font-size: .85rem
    }

    .band {
      border-radius: 14px;
      padding: 10px 14px;
      margin: 0 0 12px;
      font-weight: 700;
      background: color-mix(in srgb, var(--c) 22%, var(--card));
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent)

    .stats div:nth-child(1) b {

    .stats div:nth-child(2) b {
      color: #3ea6ff
    }

    .stats div:nth-child(3) b {
      color: #ffb020
    }

    .stats div:nth-child(4) b {
      color: #ff5fa2
    }

    .card.free {

    }

    .emo {

    nav button[aria-current=page] {
      background: color-mix(in srgb, var(--accent) 16%, transparent);

    @keyframes fin {

      font-weight: 700;
      padding: 12px;
      background: var(--card2);
      border-radius: 12px;
      margin: 8px 0;
      word-break: break-all
    }

    .iid2 {
      font-family: ui-monospace, Menlo, monospace;
      user-select: all;
      -webkit-user-select: all
    }

    #ttl,
    #ttl * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation
    }

    #ttl * {
      pointer-events: none
    }

    #ow .cmw {
      z-index: 30
    }

    nav .ni {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 26px
    }

    nav .ni svg {
      width: 22px;
      height: 22px
    }

    button.ib {
      width: 22px;
      height: 22px;
      min-width: 22px;
      min-height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 0;
      vertical-align: middle
    }

    button.ib svg {
      width: 13px;
      height: 13px;
      display: block
    }

    .hrow {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .hrow h2,
    .hrow h3 {
      margin: 0;
      flex: 1
    }

    .dash2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px
    }

    .dash2 .tile {
      min-height: 92px
    }

    .wline {
      display: flex;
      gap: 8px;
      margin-bottom: 12px
    }

    .wline div {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      text-align: center
    }

    .wline b {
      display: block;
      font-size: 1.05rem;
      color: var(--accent)
    }

    .hubg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .hubg .big {
      margin: 0;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      min-height: 104px;
      text-align: center;
      font-size: .95rem
    }

    .hubg .big:last-child:nth-child(odd) {
      grid-column: 1 / -1;
      flex-direction: row
    }

    .big .ni {
      display: flex;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center
    }

    .big .ni svg {
      width: 26px;
      height: 26px
    }

    .payg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px
    }

    .payb {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 108px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--card2);
      text-decoration: none;
      color: inherit;
      font-weight: 700;
      padding: 10px;
      text-align: center
    }

    .payb svg {
      width: 52px;
      height: 36px
    }

    .proof {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px
    }

    .proof img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0
    }

    #tour .cm,
    #inf .cm {
      text-align: start;
      max-width: 420px
    }

    .tdots {
      display: flex;
      gap: 6px;
      margin: 10px 0
    }

    .tdots i {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: var(--border)
    }

    .tdots i.on {
      background: var(--accent)
    }

    #tour {
      position: fixed;
      inset: 0;
      z-index: 28
    }

    #tour[hidden] {
      display: none
    }

    #inf[hidden] {
      display: none
    }

    .avsvg {
      width: auto;
      max-width: 100%
    }

    header .lg {
      display: inline-flex;
      align-items: center
    }

    header .lg img {
      height: 26px;
      width: auto;
      display: block
    }

    .brandlogo {
      width: 72px;
      height: auto;
      display: block;
      margin: 6px auto 8px;
      background: none;
      padding: 0;
      border-radius: 0
    }

    .brandname {
      text-align: center;
      margin: 0 0 12px;
      font-weight: 900;
      font-size: 1.45rem
    }

    .pill svg {
      width: 18px;
      height: 18px
    }

    .emo:empty {
      display: none
    }

    @media print {

      header,
      nav,
      #tb,
      #wk,
      #rtb,
      #cel,
      #wn,
      #tt,
      #ow,
      #inf,
      #tour,
      .noprint,
      .back,
      .chips,
      .row {
        display: none !important
      }

      body,
      main,
      #app {
        background: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important
      }

      .card,
      .tile,
      table {
        border: 1px solid #ccc !important;
        background: #fff !important;
        color: #000 !important;
        box-shadow: none !important;
        page-break-inside: avoid
      }
    }
  </style>
</head>
